<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030711">
<title>CHRONOS · Solar Civilization</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#eef5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:0;pointer-events:auto}.top,.panel,.bottom,.toast{z-index:5}.bottom{pointer-events:auto}.btn{position:relative;z-index:6;pointer-events:auto;cursor:pointer;-webkit-appearance:none;appearance:none}.top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.brand{font-size:10px;letter-spacing:2.5px;color:#8fa8cc;font-weight:800}.year{font-size:21px;font-weight:800;text-shadow:0 2px 12px #000}.sub{font-size:10px;color:#91a5c2}.panel{position:absolute;top:62px;left:10px;width:min(180px,47vw);padding:10px 11px;background:#07111edb;border:1px solid #24364f;border-radius:13px;backdrop-filter:blur(8px);font-size:11px;pointer-events:none}.panel h3{margin:0 0 7px;font-size:10px;letter-spacing:1.2px;color:#9fc5fa}.row{display:flex;justify-content:space-between;margin:4px 0;color:#9aacc4}.row b{color:#edf4ff}.bottom{position:absolute;left:9px;right:9px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}.controls{display:flex;gap:5px}.btn{flex:1;min-width:0;min-height:43px;padding:8px 5px;border-radius:11px;border:1px solid #344b6c;background:#0b1829f2;color:#eff6ff;font-size:12px;font-weight:700;touch-action:manipulation;user-select:none;-webkit-user-select:none}.btn:active{background:#244a75;transform:scale(.97)}.primary{background:#173b64;border-color:#568dc8}.hint{text-align:center;color:#9aacc3;font-size:10px;text-shadow:0 1px 4px black}.toast{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);background:#10243b;border:1px solid #517ba9;border-radius:12px;padding:12px 15px;font-size:12px;text-align:center;max-width:85%;opacity:0;transition:opacity .15s;pointer-events:none}.toast.on{opacity:1}.hidden{display:none}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><div><div class="brand">CHRONOS · CIVILIZATION SIM</div><div class="sub">SOL SYSTEM / TOUCH OBSERVER</div></div><div style="text-align:right"><div class="year" id="year">2026 CE</div><div class="sub" id="runstate">RUNNING · 1×</div></div></div>
<div class="panel"><h3>HUMAN CIVILIZATION</h3><div class="row"><span>Population</span><b id="pop">8.2 B</b></div><div class="row"><span>Technology</span><b id="tech">0.8</b></div><div style="height:4px;background:#192a40;border-radius:4px"><div id="bar" style="height:100%;width:8%;background:#65c8ff;border-radius:4px"></div></div><div class="row"><span>Reach</span><b id="reach">Earth</b></div><div class="row"><span>Stability</span><b id="stab">92%</b></div><div class="row"><span>Era</span><b id="era">Modern</b></div></div>
<div class="bottom"><div class="controls"><button type="button" class="btn primary" id="pause">Ⅱ Pause</button><button type="button" class="btn" id="speed">Speed · 1×</button><button type="button" class="btn" id="reset">↺ Reset</button></div><div class="controls"><button type="button" class="btn" data-skip="1">+1 year</button><button type="button" class="btn" data-skip="100">+100 years</button><button type="button" class="btn" data-skip="1000">+1,000 years</button></div><div class="controls"><button type="button" class="btn" id="expand">🚀 Expand</button><button type="button" class="btn" id="war">⚔ Conflict</button></div><div class="hint">Finger drag: rotate · Pinch: zoom · Tap planet for info</div></div><div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W=0,H=0,DPR=1;
const S={year:2026,paused:false,speed:1,tech:.8,pop:8.2,stability:92,reach:['Earth'],wars:0};let toastTimer;
const bodies=[{name:'Mercury',r:.55,orbit:75,period:88,col:'#aaa49d'},{name:'Venus',r:1.12,orbit:112,period:225,col:'#c9a16d'},{name:'Earth',r:3.7,orbit:155,period:365,col:'#347ec8',earth:true},{name:'Mars',r:1.15,orbit:198,period:687,col:'#bc624a'},{name:'Jupiter',r:3.65,orbit:258,period:4333,col:'#c8a27b'},{name:'Saturn',r:3.05,orbit:320,period:10759,col:'#c6b38b',ring:true},{name:'Uranus',r:2.2,orbit:382,period:30687,col:'#72cbd0'},{name:'Neptune',r:2.15,orbit:442,period:60190,col:'#4568d1'}];
let angle=0,tilt=.25,zoom=1,drag=false,lastX=0,lastY=0,pointers=new Map(),pinch0=0,earthSpin=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function center(){return {x:W*.52,y:H*.48}}
function proj(x,y,z){let ca=Math.cos(angle),sa=Math.sin(angle),ct=Math.cos(tilt),st=Math.sin(tilt);let xx=x*ca-z*sa,zz=x*sa+z*ca;let yy=y*ct-zz*st,depth=y*st+zz*ct;let perspective=780/(780+depth);let c=center();return {x:c.x+xx*zoom*perspective,y:c.y+yy*zoom*perspective,scale:zoom*perspective,depth}}
function drawStars(){ctx.fillStyle='#030711';ctx.fillRect(0,0,W,H);for(let i=0;i<210;i++){let x=(i*197.3%W),y=(i*91.7%H),s=(i%7===0)?1.3:.65;ctx.globalAlpha=.25+(i%5)*.12;ctx.fillStyle='#b9d4ff';ctx.fillRect(x,y,s,s)}ctx.globalAlpha=1}
function sphere(x,y,r,color,earth=false,phase=0){let g=ctx.createRadialGradient(x-r*.36,y-r*.4,r*.05,x,y,r);g.addColorStop(0,earth?'#79c9ff':light(color,45));g.addColorStop(.5,color);g.addColorStop(1,'#080b14');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(earth){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#2f8050';// continent blobs move with spin
let shift=(phase%(Math.PI*2))*r*.18;const shapes=[[-.48,-.1,.26,.45],[-.18,.28,.16,.3],[.18,-.2,.34,.18],[.3,.25,.18,.38],[.62,-.28,.18,.22],[-.72,.38,.17,.2]];shapes.forEach(([a,b,c,d])=>{ctx.beginPath();ctx.ellipse(x+(a*r*2+shift)%(r*2.1),y+b*r,c*r,d*r,Math.sin(phase)*.25,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#b9e4ff';ctx.globalAlpha=.18;ctx.fillRect(x-r,y-r*.75,r*2,r*.18);ctx.globalAlpha=1;ctx.restore();}ctx.strokeStyle=earth?'#74bfff55':'#ffffff16';ctx.lineWidth=Math.max(.5,r*.035);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}
function light(hex,amt){let n=parseInt(hex.slice(1),16),r=Math.min(255,((n>>16)&255)+amt),g=Math.min(255,((n>>8)&255)+amt),b=Math.min(255,(n&255)+amt);return `rgb(${r},${g},${b})`}
function render(){drawStars();const sunP=proj(0,0,0),sunR=18*zoom*sunP.scale;let glow=ctx.createRadialGradient(sunP.x,sunP.y,2,sunP.x,sunP.y,sunR*3.8);glow.addColorStop(0,'#ffd88744');glow.addColorStop(1,'#ffb52a00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sunP.x,sunP.y,sunR*3.8,0,Math.PI*2);ctx.fill();sphere(sunP.x,sunP.y,sunR,'#ffc65b');
// Orbit tracks
bodies.forEach(b=>{ctx.beginPath();for(let i=0;i<=180;i++){let a=i/180*Math.PI*2,p=proj(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.strokeStyle='#33466055';ctx.lineWidth=1;ctx.stroke()});
// Asteroid belt
for(let i=0;i<170;i++){let a=i*2.399963,rr=226+(i%17)*.9,p=proj(Math.cos(a+S.year*.0001)*rr,((i%9)-4)*.7,Math.sin(a+S.year*.0001)*rr);ctx.fillStyle='#747b86';ctx.fillRect(p.x,p.y,Math.max(.5,1.1*p.scale),Math.max(.5,1.1*p.scale))}
const list=bodies.map(b=>{let a=(S.year/b.period)*Math.PI*2;let p=proj(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit);return {b,p}}).sort((a,b)=>a.p.depth-b.p.depth);list.forEach(({b,p})=>{let r=b.r*5.4*p.scale;if(b.ring){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.35);ctx.strokeStyle='#b9a77b99';ctx.lineWidth=r*.5;ctx.beginPath();ctx.ellipse(0,0,r*1.7,r*.62,0,0,Math.PI*2);ctx.stroke();ctx.restore()}sphere(p.x,p.y,r,b.col,b.earth,earthSpin);if(S.reach.includes(b.name)||b.name==='Earth'){ctx.fillStyle='#4bf0bb';ctx.beginPath();ctx.arc(p.x+r*.72,p.y-r*.72,Math.max(2,2.2*p.scale),0,Math.PI*2);ctx.fill()}if(r>4){ctx.font=`${Math.max(9,10*p.scale)}px system-ui`;ctx.fillStyle='#b9d3f4';ctx.textAlign='center';ctx.fillText(b.name,p.x,p.y+r+12)}});
// settlements markers around Earth/Mars etc
if(S.reach.includes('Moon')){let p=proj(155+10,0,0);ctx.fillStyle='#5cf4c1';ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill()}
requestAnimationFrame(render)}render();
function update(){document.getElementById('year').textContent=S.year<0?`${Math.abs(S.year)} BCE`:`${Math.floor(S.year).toLocaleString()} CE`;document.getElementById('runstate').textContent=(S.paused?'PAUSED':'RUNNING')+' · '+S.speed+'×';document.getElementById('pop').textContent=S.pop.toFixed(1)+' B';document.getElementById('tech').textContent=S.tech.toFixed(1);document.getElementById('bar').style.width=Math.min(100,S.tech*9)+'%';document.getElementById('reach').textContent=S.reach.join(', ');document.getElementById('stab').textContent=Math.round(S.stability)+'%';document.getElementById('era').textContent=S.tech<1.5?'Modern':S.tech<3?'Lunar Age':S.tech<5?'Interplanetary':S.tech<8?'Solar Expansion':'Post-Planetary'}
function advance(n){S.year+=n;S.tech+=Math.max(0,n)*.0025;S.pop=Math.min(9999,S.pop*Math.pow(1.00018,Math.max(0,n)));S.stability=Math.max(20,Math.min(99,S.stability+(Math.random()*2-1)*Math.sqrt(Math.max(1,n))*.07));if(S.tech>2&&!S.reach.includes('Moon'))S.reach.push('Moon');if(S.tech>3&&!S.reach.includes('Mars'))S.reach.push('Mars');if(S.tech>5&&!S.reach.includes('Asteroid Belt'))S.reach.push('Asteroid Belt');if(S.tech>7&&!S.reach.includes('Jupiter System'))S.reach.push('Jupiter System');if(S.tech>9&&!S.reach.includes('Outer System'))S.reach.push('Outer System');update()}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2200)}
// Buttons use ordinary non-module JavaScript; controls work even if graphics code later changes.
document.getElementById('pause').addEventListener('click',()=>{S.paused=!S.paused;update();toast(S.paused?'Simulation paused':'Simulation resumed')});document.getElementById('speed').addEventListener('click',()=>{S.speed=S.speed===1?10:S.speed===10?100:S.speed===100?1000:1;update();toast('Speed set to '+S.speed+'×')});document.getElementById('reset').addEventListener('click',()=>{Object.assign(S,{year:2026,paused:false,speed:1,tech:.8,pop:8.2,stability:92,reach:['Earth'],wars:0});update();toast('Reset to year 2026')});document.querySelectorAll('[data-skip]').forEach(b=>b.addEventListener('click',()=>{let n=Number(b.dataset.skip);advance(n);toast('Advanced '+n.toLocaleString()+' years')}));document.getElementById('expand').addEventListener('click',()=>{const targets=['Moon','Mars','Asteroid Belt','Jupiter System','Saturn System','Outer System'];let nxt=targets.find(x=>!S.reach.includes(x));if(!nxt){toast('Humanity has reached the outer system');return}S.reach.push(nxt);S.tech+=.7;S.pop*=1.08;update();toast('Expansion established: '+nxt)});document.getElementById('war').addEventListener('click',()=>{S.wars++;S.stability=Math.max(25,S.stability-12);S.pop*=.985;S.tech+=.12;update();toast('Conflict simulated · losses, instability, military technology')});
// iPhone-safe delegated click fallback: buttons always receive taps above the canvas.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();b.classList.add('tapped');setTimeout(()=>b.classList.remove('tapped'),120)},true);
// Reliable mobile drag + pinch gesture handlers
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(pointers.size===1){drag=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){drag=false;let q=[...pointers.values()];pinch0=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y)}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){let q=[...pointers.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);if(pinch0)zoom=Math.max(.48,Math.min(2.5,zoom*d/pinch0));pinch0=d;return}if(drag){angle+=(e.clientX-lastX)*.006;tilt=Math.max(-1.2,Math.min(1.2,tilt+(e.clientY-lastY)*.004));lastX=e.clientX;lastY=e.clientY}});function endPointer(e){pointers.delete(e.pointerId);drag=false;pinch0=0}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('wheel',e=>{zoom=Math.max(.48,Math.min(2.5,zoom-e.deltaY*.001));},{passive:true});
let prev=performance.now(),acc=0;function tick(now){let dt=Math.min(.1,(now-prev)/1000);prev=now;if(!S.paused){acc+=dt*S.speed;if(acc>=1){let n=Math.floor(acc);acc-=n;advance(n)}}earthSpin+=dt*.5;requestAnimationFrame(tick)}requestAnimationFrame(tick);update();
})();
</script></body></html>
