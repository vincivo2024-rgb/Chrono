<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#030711"><title>CHRONOS · Solar Civilization</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#eef5ff;font-family:system-ui,-apple-system, sans-serif;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;touch-action:none}.top{position:absolute;z-index:3;top:env(safe-area-inset-top,8px);left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.brand{font-size:10px;letter-spacing:2px;color:#9bb7dd;font-weight:800}.year{font-size:21px;font-weight:800}.sub{font-size:10px;color:#9aacc4}.panel{position:absolute;z-index:3;top:58px;left:9px;width:min(190px,48vw);padding:10px;background:#071321eF;border:1px solid #344a68;border-radius:12px;font-size:11px;pointer-events:none}.panel h3{margin:0 0 7px;color:#a9cfff;font-size:10px;letter-spacing:1px}.stat{display:flex;justify-content:space-between;margin:4px 0;color:#aabbd2}.stat b{color:#fff}.bottom{position:absolute;z-index:10;left:7px;right:7px;bottom:calc(5px + env(safe-area-inset-bottom));display:grid;gap:5px;background:linear-gradient(transparent,#030711cc 15%);padding-top:13px}.controls{display:flex;gap:5px}.btn{flex:1;min-width:0;min-height:43px;border-radius:10px;border:1px solid #425c7e;background:#0b1b30;color:#f4f8ff;font-size:12px;font-weight:750;padding:7px 3px;touch-action:manipulation;pointer-events:auto;user-select:none;-webkit-user-select:none;cursor:pointer}.btn:active{background:#315b87;transform:scale(.97)}.btn.primary{background:#174474;border-color:#71a9e6}.hint{text-align:center;font-size:10px;color:#a7bad3;text-shadow:0 1px 3px #000}.toast{position:absolute;z-index:20;top:45%;left:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:12px;background:#102944;border:1px solid #7eaddb;color:white;font-size:13px;text-align:center;max-width:85%;opacity:0;pointer-events:none;transition:opacity .15s}.toast.show{opacity:1}.viewtag{position:absolute;z-index:4;top:58px;right:9px;background:#071321eF;border:1px solid #344a68;border-radius:10px;padding:8px 10px;font-size:11px;color:#d8e8ff;max-width:43vw;text-align:right;pointer-events:none}
</style></head><body>
<canvas id="space"></canvas>
<div class="top"><div><div class="brand">CHRONOS · CIVILIZATION SIM</div><div class="sub">SOL SYSTEM / TOUCH CONTROL</div></div><div style="text-align:right"><div class="year" id="year">2026 CE</div><div class="sub" id="runstate">RUNNING · 1×</div></div></div>
<div class="panel"><h3 id="paneltitle">HUMAN CIVILIZATION</h3><div class="stat"><span>Population</span><b id="pop">8.2 B</b></div><div class="stat"><span>Technology</span><b id="tech">0.8</b></div><div class="stat"><span>Territory</span><b id="reach">Earth</b></div><div class="stat"><span>Stability</span><b id="stab">92%</b></div><div class="stat"><span>Factions</span><b id="factions">1</b></div><div class="stat"><span>Wars</span><b id="wars">0</b></div></div>
<div class="viewtag" id="viewtag">SOL SYSTEM<br>Tippe einen Planeten an</div>
<div class="bottom">
<div class="controls"><button class="btn primary" id="pause" onclick="Chronos.pause()">Ⅱ Pause</button><button class="btn" id="speed" onclick="Chronos.speed()">Tempo · 1×</button><button class="btn" onclick="Chronos.reset()">↺ Reset</button></div>
<div class="controls"><button class="btn" onclick="Chronos.skip(1)">+1 Jahr</button><button class="btn" onclick="Chronos.skip(100)">+100 Jahre</button><button class="btn" onclick="Chronos.skip(1000)">+1.000 Jahre</button></div>
<div class="controls"><button class="btn" onclick="Chronos.expand()">🚀 Expandieren</button><button class="btn" onclick="Chronos.conflict()">⚔ Konflikt</button><button class="btn" onclick="Chronos.map()">🗺 Karte</button></div>
<div class="controls"><button class="btn" onclick="Chronos.zoom(1.5)">＋ Zoom</button><button class="btn" onclick="Chronos.zoom(.67)">－ Zoom</button><button class="btn" onclick="Chronos.home()">☼ Sonnensystem</button></div>
<div class="hint" id="hint">Planeten antippen · ziehen zum Drehen · zwei Finger zum Zoomen</div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const canvas=document.getElementById('space'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,D=1;
const state={year:2026,paused:false,speed:1,tech:.8,pop:8.2,stability:92,wars:0,reach:['Earth'],factions:[{name:'Earth Union',planet:'Earth',color:'#32a9e8',regions:['North America','South America','Europe','Africa','Asia','Oceania']}],selected:null,mode:'system',zoom:1,rot:0,tilt:.2,spin:0};
const planets=[{name:'Mercury',orbit:70,size:3.2,color:'#aaa49d',period:88},{name:'Venus',orbit:105,size:6,color:'#c9a16d',period:225},{name:'Earth',orbit:145,size:8.5,color:'#347ec8',period:365},{name:'Mars',orbit:185,size:5.8,color:'#bc624a',period:687},{name:'Jupiter',orbit:238,size:15,color:'#c8a27b',period:4333},{name:'Saturn',orbit:294,size:12,color:'#c6b38b',period:10759,ring:true},{name:'Uranus',orbit:350,size:9,color:'#72cbd0',period:30687},{name:'Neptune',orbit:405,size:9,color:'#4568d1',period:60190}];
const regions=[{n:'North America',x:-.43,y:-.08,w:.25,h:.31,c:'#32a9e8'},{n:'South America',x:-.22,y:.34,w:.12,h:.36,c:'#32a9e8'},{n:'Europe',x:.08,y:-.12,w:.15,h:.13,c:'#32a9e8'},{n:'Africa',x:.12,y:.18,w:.17,h:.3,c:'#32a9e8'},{n:'Asia',x:.42,y:-.02,w:.34,h:.24,c:'#32a9e8'},{n:'Oceania',x:.55,y:.38,w:.17,h:.12,c:'#32a9e8'}];
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),2100)}
function update(){document.getElementById('year').textContent=Math.floor(state.year).toLocaleString('de-DE')+' CE';document.getElementById('runstate').textContent=(state.paused?'PAUSE':'LÄUFT')+' · '+state.speed+'×';document.getElementById('pop').textContent=state.pop.toFixed(1)+' Mrd.';document.getElementById('tech').textContent=state.tech.toFixed(1);document.getElementById('reach').textContent=state.reach.join(', ');document.getElementById('stab').textContent=Math.round(state.stability)+'%';document.getElementById('factions').textContent=state.factions.length;document.getElementById('wars').textContent=state.wars;document.getElementById('pause').textContent=state.paused?'▶ Weiter':'Ⅱ Pause';document.getElementById('speed').textContent='Tempo · '+state.speed+'×';}
function advance(n){state.year+=n;state.tech+=n*.0024;state.pop=Math.min(9000,state.pop*Math.pow(1.00016,n));state.stability=Math.max(18,Math.min(99,state.stability+(Math.random()-.48)*Math.sqrt(n)*.1));if(state.tech>=2&&!state.reach.includes('Moon'))state.reach.push('Moon');if(state.tech>=3&&!state.reach.includes('Mars'))state.reach.push('Mars');if(state.tech>=5&&!state.reach.includes('Asteroid Belt'))state.reach.push('Asteroid Belt');if(state.tech>=7&&!state.reach.includes('Jupiter System'))state.reach.push('Jupiter System');if(state.tech>=9&&!state.reach.includes('Outer System'))state.reach.push('Outer System');if(state.year>2300&&!state.factions.some(f=>f.name==='Mars Free Cities'))state.factions.push({name:'Mars Free Cities',planet:'Mars',color:'#ed7652',regions:['Olympus','Valles Marineris','Hellas']});update()}
function project(x,y,z){let a=state.rot,t=state.tilt,xx=x*Math.cos(a)-z*Math.sin(a),zz=x*Math.sin(a)+z*Math.cos(a),yy=y*Math.cos(t)-zz*Math.sin(t),depth=y*Math.sin(t)+zz*Math.cos(t),p=600/(600+depth),cx=W*.52,cy=H*.43;return{x:cx+xx*state.zoom*p,y:cy+yy*state.zoom*p,p,depth}}
function starfield(){ctx.fillStyle='#030711';ctx.fillRect(0,0,W,H);for(let i=0;i<170;i++){ctx.globalAlpha=.2+(i%4)*.13;ctx.fillStyle='#c6ddff';ctx.fillRect((i*193.7)%W,(i*97.3)%H,i%9===0?1.4:.7,.8)}ctx.globalAlpha=1}
function drawSphere(x,y,r,col,earth=false,phase=0){let g=ctx.createRadialGradient(x-r*.35,y-r*.38,r*.05,x,y,r);g.addColorStop(0,earth?'#9bdcff':col);g.addColorStop(.55,col);g.addColorStop(1,'#050914');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();if(earth){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();ctx.fillStyle='#348451';for(let i=0;i<9;i++){let xx=x+Math.sin(i*2.4+phase)*r*.62, yy=y+Math.cos(i*1.7)*r*.48;ctx.beginPath();ctx.ellipse(xx,yy,r*(.1+(i%3)*.035),r*(.16+(i%2)*.06),i*.5,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#b5eaff';ctx.globalAlpha=.15;ctx.fillRect(x-r,y-r*.75,r*2,r*.17);ctx.globalAlpha=1;ctx.restore()}ctx.strokeStyle='#b9dfff44';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}
function drawSystem(){starfield();let sun=project(0,0,0),sr=15*sun.p*state.zoom;let glow=ctx.createRadialGradient(sun.x,sun.y,1,sun.x,sun.y,sr*4);glow.addColorStop(0,'#ffd36c99');glow.addColorStop(1,'#ffb52a00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(sun.x,sun.y,sr*4,0,Math.PI*2);ctx.fill();drawSphere(sun.x,sun.y,sr,'#ffc65b');planets.forEach(b=>{ctx.beginPath();for(let i=0;i<=160;i++){let a=i/160*Math.PI*2,p=project(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit);i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)}ctx.strokeStyle='#34486166';ctx.lineWidth=1;ctx.stroke()});planets.forEach(b=>{let a=state.year/b.period*Math.PI*2,p=project(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit),r=b.size*p.p*state.zoom;if(b.ring){ctx.strokeStyle='#c5b38a99';ctx.lineWidth=Math.max(2,r*.5);ctx.beginPath();ctx.ellipse(p.x,p.y,r*1.7,r*.55,-.3,0,Math.PI*2);ctx.stroke()}drawSphere(p.x,p.y,Math.max(2,r),b.color,b.name==='Earth',state.spin);ctx.fillStyle='#d4e6ff';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(b.name,p.x,p.y+r+13);if(state.reach.includes(b.name)){ctx.fillStyle='#51f0bd';ctx.beginPath();ctx.arc(p.x+r*.8,p.y-r*.8,3,0,Math.PI*2);ctx.fill()}})}
function drawSurface(){starfield();let b=planets.find(p=>p.name===state.selected)||planets[2],r=Math.min(W,H)*.39*state.zoom;let x=W*.52,y=H*.43;drawSphere(x,y,r,b.color,b.name==='Earth',state.spin);if(b.name==='Earth'){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();regions.forEach((q,i)=>{let rx=x+(q.x+Math.sin(state.spin*.12+i)*.025)*r*1.5,ry=y+q.y*r*1.4;ctx.fillStyle=q.c+'aa';ctx.strokeStyle='#e7f4ffcc';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(rx,ry,q.w*r,q.h*r,.3,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.fillText(q.n,rx,ry)});if(state.factions.some(f=>f.planet==='Mars')){ctx.fillStyle='#ff9a68';ctx.font='bold 12px system-ui';ctx.fillText('MARS: FREE CITIES',x,y+r*.78)}ctx.restore();ctx.fillStyle='#eaf4ff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('TERRITORIEN · '+b.name.toUpperCase(),x,y-r-18)}else{ctx.fillStyle='#d9eaff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('BESIEDELUNGEN · '+b.name.toUpperCase(),x,y-r-18);if(state.reach.includes(b.name)){ctx.fillStyle='#4ff0bb';ctx.beginPath();ctx.arc(x+r*.25,y-r*.2,7,0,Math.PI*2);ctx.fill();ctx.fillText('Kolonie',x+r*.25,y-r*.2-13)}}}
function render(){if(state.mode==='system')drawSystem();else drawSurface();requestAnimationFrame(render)}render();
const Chronos={pause(){state.paused=!state.paused;update();toast(state.paused?'Simulation pausiert':'Simulation läuft weiter')},speed(){state.speed=state.speed===1?10:state.speed===10?100:state.speed===100?1000:1;update();toast('Zeittempo: '+state.speed+'×')},skip(n){advance(n);toast(n.toLocaleString('de-DE')+' Jahre vergangen')},reset(){Object.assign(state,{year:2026,paused:false,speed:1,tech:.8,pop:8.2,stability:92,wars:0,reach:['Earth'],factions:[{name:'Earth Union',planet:'Earth',color:'#32a9e8',regions:[]}],selected:null,mode:'system',zoom:1});update();toast('Simulation auf 2026 zurückgesetzt')},expand(){let targets=['Moon','Mars','Asteroid Belt','Jupiter System','Saturn System','Outer System'],next=targets.find(x=>!state.reach.includes(x));if(!next){toast('Das Sonnensystem ist erreicht!');return}state.reach.push(next);state.tech+=.45;if(next==='Mars'&&!state.factions.some(f=>f.planet==='Mars'))state.factions.push({name:'Mars Free Cities',planet:'Mars',color:'#ed7652',regions:['Olympus','Valles Marineris']});update();toast('Neue Expansion: '+next)},conflict(){state.wars++;state.stability=Math.max(15,state.stability-10);state.pop*=.99;state.tech+=.18;if(!state.factions.some(f=>f.name==='Mars Free Cities'))state.factions.push({name:'Mars Free Cities',planet:'Mars',color:'#ed7652',regions:['Olympus','Valles Marineris']});update();toast('Konflikt simuliert: Verluste, Instabilität und Militärtechnik')},map(){if(!state.selected)state.selected='Earth';state.mode='surface';state.zoom=1;document.getElementById('viewtag').innerHTML='PLANETENANSICHT<br>'+state.selected+' · Gebiete';document.getElementById('hint').textContent='Mit einem Finger drehen · mit zwei Fingern zoomen · Sonnensystem für Übersicht';toast('Kartenansicht: '+state.selected)},zoom(f){state.zoom=Math.max(.55,Math.min(3.2,state.zoom*f));toast('Zoom '+Math.round(state.zoom*100)+'%')},home(){state.mode='system';state.zoom=1;state.selected=null;document.getElementById('viewtag').innerHTML='SOL SYSTEM<br>Tippe einen Planeten an';document.getElementById('hint').textContent='Planeten antippen · ziehen zum Drehen · zwei Finger zum Zoomen';toast('Sonnensystem')},focus(name){state.selected=name;state.mode='surface';state.zoom=1;document.getElementById('viewtag').innerHTML='PLANETENANSICHT<br>'+name+' · Gebiete';document.getElementById('hint').textContent='Planet drehen · Pinch zum Zoomen · Sonnensystem für Übersicht';toast(name+' ausgewählt')}};window.Chronos=Chronos;
let pts=new Map(),last=null,pinch=0;canvas.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};if(pts.size===2){let a=[...pts.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});canvas.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){let a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch)state.zoom=Math.max(.55,Math.min(3.2,state.zoom*d/pinch));pinch=d}else if(last){state.rot+=(e.clientX-last.x)*.006;state.tilt=Math.max(-1,Math.min(1,state.tilt+(e.clientY-last.y)*.003));last={x:e.clientX,y:e.clientY}}});function up(e){let p=pts.get(e.pointerId);pts.delete(e.pointerId);if(pts.size<2)pinch=0;if(p&&last&&Math.abs(p.x-last.x)<8&&Math.abs(p.y-last.y)<8&&state.mode==='system'){let best=null,bd=1e9;planets.forEach(b=>{let a=state.year/b.period*Math.PI*2,q=project(Math.cos(a)*b.orbit,0,Math.sin(a)*b.orbit),d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=b}});if(best&&bd<Math.max(34,55*state.zoom))Chronos.focus(best.name)}last=null}canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);canvas.addEventListener('wheel',e=>{state.zoom=Math.max(.55,Math.min(3.2,state.zoom-e.deltaY*.001));},{passive:true});
let prev=performance.now(),acc=0;function tick(now){let dt=Math.min(.1,(now-prev)/1000);prev=now;if(!state.paused){acc+=dt*state.speed;if(acc>=1){let n=Math.min(1000,Math.floor(acc));acc-=n;advance(n)}}state.spin+=dt*.35;requestAnimationFrame(tick)}requestAnimationFrame(tick);update();
</script></body></html>
